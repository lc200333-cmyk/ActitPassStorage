name: Release
run-name: Release from ${{ github.ref_name }} @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump: patch, minor, major, or explicit x.y.z"
        required: false
        default: "patch"
  push:
    branches: [ master ]
    paths:
      - "app/**"
      - "core/**"
      - "tools/**"
      - "docker/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/release.yml"

permissions:
  contents: write

# Serialize releases so each run bumps the version produced by the previous run.
concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify packaging
        run: npm test
      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze Flutter
        working-directory: app
        run: flutter analyze
      - name: Test Flutter
        working-directory: app
        run: flutter test
      - name: Verify Rust
        working-directory: core
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

  version:
    needs: verify
    if: github.event_name == 'workflow_dispatch' || (github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip release]'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Bump version
        id: version
        shell: bash
        run: |
          BUMP="${{ github.event.inputs.bump || 'patch' }}"
          COMMIT_MESSAGE="$(git log -1 --pretty=%B)"
          if [[ "$COMMIT_MESSAGE" =~ \[release[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+)\] ]]; then
            BUMP="${BASH_REMATCH[1]}"
          fi
          VERSION="$(node tools/bump_version.js "$BUMP")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and tag version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json app/pubspec.yaml core/Cargo.toml core/Cargo.lock tools/windows/Wallet-APS.iss tools/build_linux_deb.sh
          git commit -m "chore: release v$VERSION [skip release]"
          git tag -a "v$VERSION" -m "Wallet APS v$VERSION"
          git push origin HEAD:master
          git push origin "refs/tags/v$VERSION"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Flutter Windows
        working-directory: app
        run: flutter create --platforms=windows .

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Apply branding (name + icons)
        shell: bash
        run: tools/apply_branding.sh

      - name: Analyze Flutter app
        working-directory: app
        run: flutter analyze

      - name: Build Windows app
        working-directory: app
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "tools\windows\Wallet-APS.iss"
          Copy-Item "dist\Wallet-APS-Setup-${{ needs.version.outputs.version }}.exe" "dist\Wallet-APS-Setup.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist/Wallet-APS-Setup.exe
          retention-days: 1

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Prepare and verify Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_CERT_SHA256"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/android/release-keystore.jks
          keytool -exportcert \
            -keystore app/android/release-keystore.jks \
            -storepass "$ANDROID_STORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -rfc > /tmp/wallet-aps-release.pem
          ACTUAL="$(openssl x509 -in /tmp/wallet-aps-release.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="$(printf '%s' "$ANDROID_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test "$ACTUAL" = "$EXPECTED"

      - name: Build release APK in Docker
        env:
          ANDROID_KEYSTORE_PATH: /workspace/app/android/release-keystore.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          mkdir -p dist
          docker compose build build-apk
          HOST_UID="$(id -u)" HOST_GID="$(id -g)" docker compose run --rm -e BUILD_MODE=release build-apk

      - name: Remove Android release keystore
        if: always()
        shell: bash
        run: rm -f app/android/release-keystore.jks /tmp/wallet-aps-release.pem

      - name: Download previous Android release
        if: needs.version.outputs.tag != 'v0.4.13'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p /tmp/wallet-aps-previous
          gh release download --pattern Wallet-APS-android.apk --dir /tmp/wallet-aps-previous

      - name: Set up Flutter for Android instrumentation tests
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify Android in-place upgrade
        if: needs.version.outputs.tag != 'v0.4.13'
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            bash tools/verify_android_upgrade.sh /tmp/wallet-aps-previous/Wallet-APS-android.apk dist/Wallet-APS-android.apk
            bash tools/run_android_instrumentation.sh

      # Releases through v0.4.10 used temporary debug certificates that were
      # not preserved. Android cannot upgrade those APKs to the permanent key.
      # v0.4.13 establishes the permanent signing baseline once; every later
      # release must pass the normal in-place upgrade check above.
      - name: Establish permanent Android signing baseline
        if: needs.version.outputs.tag == 'v0.4.13'
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            adb install dist/Wallet-APS-android.apk
            adb shell pm path com.example.actit_pass_storage >/dev/null
            bash tools/run_android_instrumentation.sh

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/Wallet-APS-android.apk
          retention-days: 1

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Build deb in Docker
        shell: bash
        run: |
          mkdir -p dist
          docker compose build build-deb
          HOST_UID="$(id -u)" HOST_GID="$(id -g)" docker compose run --rm build-deb

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/Wallet-APS-linux-amd64.deb
          retention-days: 1

  publish:
    needs: [version, windows, android, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Wallet APS ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            release-assets/Wallet-APS-Setup.exe
            release-assets/Wallet-APS-android.apk
            release-assets/Wallet-APS-linux-amd64.deb

      - name: Keep only last 2 releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release list --limit 100 --json tagName,isDraft,createdAt \
            --jq '[.[] | select(.isDraft == false)] | sort_by(.createdAt) | reverse | .[2:] | .[].tagName' |
          while read -r tag; do
            [ -z "$tag" ] && continue
            gh release delete "$tag" -y --cleanup-tag
          done
